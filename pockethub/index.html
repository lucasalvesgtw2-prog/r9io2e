<!doctype html>
<html lang="de" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<title>PocketHub</title>
<style>
:root{--bg:#0b0d12;--card:#14171e;--card2:#1c2029;--border:#252a35;--border2:#3a4150;--text:#eef0f4;--muted:#8b93a3;--accent:#6d6af8;--accent-t:#fff;--ok:#22c55e;--danger:#ef4444;--warn:#f59e0b;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme=light]{color-scheme:light;--bg:#f5f6f8;--card:#fff;--card2:#f0f2f5;--border:#e5e7eb;--border2:#cbd0d8;--text:#0f1219;--muted:#6b7280;--accent:#4f46e5;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.08)}
@media (prefers-color-scheme: light){:root[data-theme=system]{color-scheme:light;--bg:#f5f6f8;--card:#fff;--card2:#f0f2f5;--border:#e5e7eb;--border2:#cbd0d8;--text:#0f1219;--muted:#6b7280;--accent:#4f46e5;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.08)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
input.invalid,textarea.invalid{border-color:var(--danger);animation:shake .3s}
textarea{resize:vertical}
.ic{display:block;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:ui-monospace,"Roboto Mono",Consolas,monospace}
/* Top bar */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.bar h1{flex:1;font-size:17px;font-weight:600;margin:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.bar-actions{display:flex;gap:2px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;flex:none;color:var(--text);transition:background .15s}
.icon-btn:hover,.icon-btn:active{background:var(--card2)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;color:var(--muted)}
.icon-btn.danger{color:var(--danger)}
.content{padding:16px 16px 112px;max-width:720px;margin:0 auto}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 45%,transparent);z-index:20;transition:transform .1s}
.fab:active{transform:scale(.94)}
/* Basics */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .ic{color:var(--muted)}
.info{display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.info>.ic{color:var(--accent)}
.info span{flex:1}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row.bl{border-left:3px solid var(--c)}
.row-main{flex:1;min-width:0;cursor:pointer}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row-sub{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.done .row-title{text-decoration:line-through;color:var(--muted)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border2);flex:none;display:grid;place-items:center;transition:.15s;color:#fff}
.check .ic{opacity:0;transform:scale(.6);transition:.15s}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on .ic{opacity:1;transform:none}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 2px 10px;font-weight:600;display:flex;align-items:center;gap:6px}
.sec:first-child{margin-top:2px}
.sec.warn{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14px}
.empty-ic{width:60px;height:60px;border-radius:18px;background:var(--card2);display:grid;place-items:center;margin:0 auto 14px;color:var(--muted)}
.empty p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--border);font-weight:600;font-size:14px;white-space:nowrap;transition:filter .15s}
.btn:active{filter:brightness(.92)}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.danger-o{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;margin-top:8px}
.btn.big{flex:1;padding:15px;font-size:16px;border-radius:14px}
.btn-row{display:flex;gap:10px;margin:16px 0}
.hint{color:var(--muted);font-size:12.5px;margin:10px 2px;line-height:1.5}
.warn{color:var(--warn)}
.neg{color:var(--danger)} .pos{color:var(--ok)}
.badge{display:inline-flex;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted)}
.badge.high{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.badge.low{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.meta{display:inline-flex;align-items:center;gap:4px}
.search{position:relative;margin-bottom:14px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:40px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);min-width:fit-content;transition:.15s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg.big{margin-bottom:16px}
.addbar{display:flex;gap:8px;margin-bottom:14px}
.addbar input{flex:1}
.addbar .btn{padding:0 14px}
.ichip{display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.progress{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* Home */
.home{padding:calc(22px + env(safe-area-inset-top)) 16px 32px;max-width:720px;margin:0 auto}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px}
.home-date{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.home-greet{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.home-btns{display:flex;gap:4px}
.home-btns .icon-btn{background:var(--card);border:1px solid var(--border)}
.overview{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:10px}
.ov-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:500}
.ov-v{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-v.sm{font-size:14px;font-weight:600;letter-spacing:0}
.ov-v small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 10px;display:flex;align-items:center;gap:10px;min-height:66px;text-align:left;transition:transform .1s,background .15s}
.tile:active{transform:scale(.97);background:var(--card2)}
.tile-l{font-size:13px;font-weight:600;line-height:1.25;min-width:0;hyphens:auto;-webkit-hyphens:auto}
/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:16px;font-weight:600;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:6px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:500;position:relative;font-size:14px}
.cal-cell:hover{background:var(--card2)}
.cal-cell.other{color:var(--muted);opacity:.45}
.cal-cell.today{color:var(--accent);font-weight:700}
.cal-cell.sel{background:var(--accent);color:var(--accent-t);font-weight:600}
.cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:6px}
.cal-cell.sel .dot{background:#fff}
.day-title{text-transform:none}
.tm{font-weight:600;color:var(--c,var(--accent));font-variant-numeric:tabular-nums;margin-right:6px}
/* Clock */
.clock-big{font-size:60px;font-weight:600;text-align:center;letter-spacing:-.03em;margin:24px 0 4px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.clock-date{text-align:center;color:var(--muted);margin-bottom:8px}
.wc-time{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tmr-inputs{display:flex;gap:10px;align-items:center;justify-content:center;margin:24px 0 16px}
.tmr-inputs input{width:104px;text-align:center;font-size:34px;font-weight:600;padding:10px}
.tmr-inputs span{font-size:32px;font-weight:600;color:var(--muted)}
.presets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
/* Week */
.week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px}
.week-head div{text-align:center}
.week-head b{font-weight:600}
.week-head small{display:block;color:var(--muted);font-size:12px}
.day-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 12px 10px 14px;margin-bottom:8px}
.day-card.today{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.day-card header{display:flex;justify-content:space-between;align-items:center}
.day-card header b{text-transform:capitalize;font-weight:600}
.day-card header small{color:var(--muted);margin-left:8px;font-size:12.5px}
.day-card.today header b{color:var(--accent)}
.day-entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.day-entry:first-of-type{margin-top:6px}
.day-entry .t{flex:1;cursor:pointer;overflow-wrap:anywhere}
.day-entry.done .t{text-decoration:line-through;color:var(--muted)}
/* Notes */
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:600px){.notes-grid{grid-template-columns:repeat(3,1fr)}}
.note-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px}
.note-t{font-weight:600;overflow-wrap:anywhere}
.note-b{color:var(--muted);font-size:13px;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;white-space:pre-wrap;overflow-wrap:anywhere}
.note-d{font-size:11px;color:var(--muted)}
.notes-grid .empty{grid-column:1/-1}
.note-title-in{font-size:22px;font-weight:700;background:transparent;border:0;padding:6px 2px;margin-bottom:4px;letter-spacing:-.01em}
.note-body-in{background:transparent;border:0;padding:6px 2px;min-height:calc(100vh - 200px);resize:none;line-height:1.6}
.note-title-in:focus,.note-body-in:focus{border:0;box-shadow:none}
/* Passwords */
.avatar{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:grid;place-items:center;font-weight:700;flex:none;font-size:16px}
.kv{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);font-size:12.5px;width:96px;flex:none}
.kv b{flex:1;font-weight:500;overflow-wrap:anywhere;min-width:0;white-space:pre-wrap}
/* Calculator */
.calc-display{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;text-align:right;margin-bottom:12px;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-expr{font-size:36px;font-weight:500;overflow-wrap:anywhere;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.calc-prev{color:var(--muted);font-size:18px;min-height:26px;margin-top:6px;font-variant-numeric:tabular-nums}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-keys button{height:62px;border-radius:16px;background:var(--card);border:1px solid var(--border);font-size:22px;font-weight:500;display:grid;place-items:center}
.calc-keys button:active{background:var(--card2)}
.calc-keys .op{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent);border-color:transparent;font-size:24px}
.calc-keys .eq{background:var(--accent);color:var(--accent-t);grid-column:span 4;border-color:transparent}
.calc-keys .fn{color:var(--muted);font-size:18px}
/* Money */
.money-hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 12px 30px rgba(79,70,229,.3)}
.mh-cur{display:block;width:100%;text-align:left;color:#fff}
.mh-cur span,.mh-grid span{display:block;font-size:12.5px;opacity:.8;font-weight:500}
.mh-cur b{display:block;font-size:38px;font-weight:700;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.mh-cur .mh-edit{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.85;margin-top:6px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px}
.mh-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.mh-grid b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.money-hero .neg{color:#fecaca}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
/* Currency */
.cur-row{display:flex;gap:10px;align-items:center}
.cur-row input{font-size:26px;font-weight:600;flex:1;min-width:0}
.cur-row select{width:auto;max-width:60%;font-weight:600;padding:12px 8px}
.cur-fixed{font-weight:600;padding:0 16px;background:var(--card2);border:1px solid var(--border);border-radius:12px;height:52px;display:grid;place-items:center;white-space:nowrap}
.cur-res{flex:1;font-size:26px;font-weight:700;min-width:0;overflow-wrap:anywhere;padding:8px 2px;font-variant-numeric:tabular-nums}
.swap{display:grid;place-items:center;margin:10px auto;width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--accent)}
/* Brawl */
.bs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:600px){.bs-grid{grid-template-columns:repeat(3,1fr)}}
.bs-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.bs-card img,.bs-ph{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.bs-title{padding:10px 12px 12px;font-weight:600;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:space-between;gap:6px}
.bs-title .ic{color:var(--muted)}
.bs-hero{width:100%;border-radius:16px;margin-bottom:12px;max-height:60vh;object-fit:contain;background:var(--card2);display:block}
/* Modal */
.modal-wrap{position:fixed;inset:0;background:rgba(5,7,12,.6);backdrop-filter:blur(2px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal-wrap.top{z-index:80}
@media(min-width:600px){.modal-wrap{align-items:center}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1);border:1px solid var(--border);border-bottom:0}
.modal::before{content:"";display:block;width:36px;height:4px;border-radius:9px;background:var(--border2);margin:2px auto 14px}
@media(min-width:600px){.modal{border-radius:24px;border-bottom:1px solid var(--border)}}
.modal h2{margin:0 0 14px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal-btns .left{margin-right:auto}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.pw-row{display:flex;gap:6px;align-items:center}
.pw-row input{flex:1}
.pw-row .icon-btn{background:var(--card2);border:1px solid var(--border);width:44px;height:44px}
.img-pick{display:block;border:1.5px dashed var(--border2);border-radius:14px;overflow:hidden;cursor:pointer;text-align:center}
.img-pick img{width:100%;max-height:220px;object-fit:cover;display:block}
.img-ph{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px;color:var(--muted);font-size:13.5px}
/* PIN */
.pin-overlay{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;animation:fade .15s;padding:16px}
.pin-overlay.full{z-index:60;background:var(--bg);backdrop-filter:none}
.pin-box{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:28px 20px 22px;width:100%;max-width:340px;text-align:center;box-shadow:var(--shadow)}
.pin-overlay.full .pin-box{background:transparent;box-shadow:none;border:0}
.pin-logo{width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);display:grid;place-items:center;margin:0 auto}
.pin-title{font-size:19px;font-weight:600;margin-top:14px;letter-spacing:-.01em}
.pin-sub{color:var(--muted);font-size:13.5px;margin-top:4px;min-height:18px;line-height:1.45}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:24px 0 8px}
.pin-dots i{width:13px;height:13px;border-radius:50%;background:var(--border2);transition:.15s}
.pin-dots i.on{background:var(--accent);transform:scale(1.15)}
.pin-dots.shake{animation:shake .35s}
.pin-err{color:var(--danger);font-size:13px;min-height:20px;margin-bottom:12px;font-weight:500}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;max-width:270px;margin:0 auto}
.pin-keys button{height:68px;width:68px;border-radius:50%;margin:0 auto;font-size:25px;font-weight:500;background:var(--card2);display:grid;place-items:center;transition:background .1s}
.pin-overlay:not(.full) .pin-keys button{background:var(--bg)}
.pin-keys button:active{background:var(--accent);color:var(--accent-t)}
.pin-keys .pk-txt{background:transparent!important;font-size:13.5px;font-weight:600;color:var(--muted)}
.pin-overlay.busy .pin-keys{opacity:.5;pointer-events:none}
.pin-extra{margin-top:20px}
.link{color:var(--accent);font-weight:600;font-size:13.5px}
.lang-pick{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.lang-pick .btn{justify-content:flex-start;padding:16px;font-size:15px;border-radius:14px;background:var(--card);gap:12px}
.lang-pick .btn .code{width:34px;height:24px;border-radius:6px;background:var(--card2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.lang-pick .btn .ic:last-child{margin-left:auto;color:var(--muted)}
/* Toast */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
</style>

/* Image compression for Brawl Stars screenshots */
function compressImage(file, max = 1280, q = 0.82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

  return Array.from(a, x => chars[x % chars.length]).join('');
}

    else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
    else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
    else break;
  }
  return toLocalDT(d);
}

/* ============================= CALCULATOR ============================= */
let CALC = '';
function calcEval(expr) {
  const s = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.');
  let i = 0, lastPct = false, termPct = false;
  const ws = () => { while (s[i] === ' ') i++; };
  // "a + b%" means a plus b percent of a (like phone calculators); "b%" alone is b/100
  function pExpr() {
    let v = pTerm();
    for (; ;) {
      ws();
      if (s[i] === '+') { i++; const x = pTerm(); v += termPct ? v * x : x; }
      else if (s[i] === '-') { i++; const x = pTerm(); v -= termPct ? v * x : x; }
      else return v;
    }
  }
  function pTerm() { let v = pFactor(); termPct = lastPct; for (; ;) { ws(); if (s[i] === '*') { i++; v *= pFactor(); termPct = false; } else if (s[i] === '/') { i++; v /= pFactor(); termPct = false; } else return v; } }
  function pFactor() { ws(); if (s[i] === '-') { i++; return -pFactor(); } if (s[i] === '+') { i++; return pFactor(); } return pPost(); }
  function pPost() { let v = pPrim(); lastPct = false; for (; ;) { ws(); if (s[i] === '%') { i++; v /= 100; lastPct = true; } else return v; } }
  function pPrim() {
    ws();
    if (s[i] === '(') { i++; const v = pExpr(); ws(); if (s[i] === ')') i++; return v; }
    const m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
    if (!m) throw new Error('syntax');
    i += m[0].length; return parseFloat(m[0]);
  }
  if (!s.trim()) throw new Error('empty');
  const v = pExpr(); ws();
  if (i < s.length) throw new Error('syntax');
  if (!isFinite(v)) throw new Error('math');
  return Number(v.toPrecision(12));
}
const calcShow = s => L() === 'de' ? s.replace(/\./g, ',') : s;
const CALC_KEYS = [['C', 'fn'], ['⌫', 'fn'], ['%', 'op'], ['÷', 'op'], ['7'], ['8'], ['9'], ['×', 'op'], ['4'], ['5'], ['6'], ['−', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['('], ['0'], ['.'], [')'], ['=', 'eq']];
V.calc = {
  title: () => t('m_calc'),
  html() {
    const hist = S.calcHistory.slice().reverse().map((h, i) => `<div class="row"><div class="row-main num" data-act="calcHist" data-i="${S.calcHistory.length - 1 - i}"><div class="row-sub">${esc(calcShow(h.e))} =</div><div class="row-title">${esc(calcShow(h.r))}</div></div></div>`).join('');
    const label = k => k === '⌫' ? ic('backspace', 22, 1.8) : k === '.' ? (L() === 'de' ? ',' : '.') : k;
    const body = `<div class="calc-display"><div class="calc-expr" id="calc-expr">${esc(calcShow(CALC)) || '0'}</div><div class="calc-prev" id="calc-prev"></div></div>
      <div class="calc-keys">${CALC_KEYS.map(([k, c]) => `<button class="${c || ''}" data-act="calcKey" data-k="${k}">${label(k)}</button>`).join('')}</div>
      ${hist ? `<h3 class="sec">${t('history')}</h3>${hist}<button class="btn block" data-act="calcClearHist">${t('clearHistory')}</button>` : ''}`;
    return page(t('m_calc'), body);
  },
  mount() { calcUpdate(); }
};
function calcUpdate() {
  const e = $('#calc-expr'); if (!e) return;
  e.textContent = calcShow(CALC) || '0';
  let prev = '';
  if (/[+\-−×÷*/%(]/.test(CALC.replace(/^-/, ''))) { try { prev = '= ' + calcShow(String(calcEval(CALC))); } catch { } }
  $('#calc-prev').textContent = prev;
}
A.calcKey = el => {
  const k = el.dataset.k;
  if (k === 'C') CALC = '';
  else if (k === '⌫') CALC = CALC.slice(0, -1);
  else if (k === '=') {
    try {
      const r = String(calcEval(CALC));
      S.calcHistory.push({ e: CALC, r }); if (S.calcHistory.length > 30) S.calcHistory.shift(); save('calcHistory');
      CALC = r; rerender(); return;
    } catch { $('#calc-prev').textContent = t('calcError'); navigator.vibrate && navigator.vibrate(80); return; }
  } else {
    const ops = '+−×÷';
    if (ops.includes(k) && ops.includes(CALC.slice(-1))) CALC = CALC.slice(0, -1) + k;
    else if (k === '.') { const last = CALC.split(/[+−×÷()%]/).pop(); if (!last.includes('.')) CALC += last ? '.' : '0.'; }
    else CALC += k;
  }
  calcUpdate();
};

/* ============================ VIRTUAL MONEY ============================ */
function moneyCalc() {
  const e = S.money.entries;
  const done = e.filter(x => x.done).reduce((s, x) => s + x.amount, 0);
  const planned = e.filter(x => !x.done).reduce((s, x) => s + x.amount, 0);
  return { current: S.money.start + done, planned, projected: S.money.start + done + planned };
}
V.money = {

/* ============================== CURRENCY ============================== */
const CURS = ['USD', 'GBP', 'CHF', 'JPY', 'PLN', 'CZK', 'HUF', 'SEK', 'NOK', 'DKK', 'ISK', 'TRY', 'RON', 'AUD', 'CAD', 'NZD', 'CNY', 'HKD', 'SGD', 'KRW', 'INR', 'IDR', 'MYR', 'PHP', 'THB', 'ILS', 'BRL', 'MXN', 'ZAR'];
const FALLBACK_RATES = { USD: 1.16, GBP: 0.88, CHF: 0.93, JPY: 178, PLN: 4.24, CZK: 24.2, HUF: 385, SEK: 10.9, NOK: 11.7, DKK: 7.47, ISK: 146, TRY: 49, RON: 5.09, AUD: 1.77, CAD: 1.63, NZD: 2.03, CNY: 8.25, HKD: 9.0, SGD: 1.51, KRW: 1680, INR: 103, IDR: 19300, MYR: 4.85, PHP: 68, THB: 37.5, ILS: 3.8, BRL: 6.2, MXN: 21.3, ZAR: 20 };
const getRates = () => (S.rates && S.rates.rates) || FALLBACK_RATES;
let curNames = null;
function curName(c) { try { curNames = curNames && curNames.lang === L() ? curNames : { lang: L(), dn: new Intl.DisplayNames([LOC()], { type: 'currency' }) }; return curNames.dn.of(c); } catch { return c; } }
const fmtCur = (v, c) => { try { return new Intl.NumberFormat(LOC(), { style: 'currency', currency: c, maximumFractionDigits: v !== 0 && Math.abs(v) < 1 ? 4 : 2 }).format(v); } catch { return v.toFixed(2) + ' ' + c; } };
async function fetchRates(force) {
  if (!force && S.rates && Date.now() - S.rates.fetched < 6 * 3600e3) return;
  for (const url of ['https://api.frankfurter.dev/v1/latest?base=EUR', 'https://api.frankfurter.app/latest?from=EUR']) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) continue;
      const j = await res.json();
      if (!j.rates || !j.rates.USD) continue;
      S.rates = { date: j.date, rates: j.rates, fetched: Date.now() }; save('rates');
      if (CUR_VIEW === V.currency) curUpdate();
      if (force) toast(t('ratesOk'));
      return;
    } catch { }
  }
  if (force) toast(t('ratesFail'));
}
V.currency = {
  title: () => t('m_currency'),
  html() {
    const c = S.settings.cur, rates = getRates();
    const sel = `<select data-change="curCode" aria-label="currency">${CURS.filter(x => rates[x]).map(x => `<option value="${x}" ${x === c.code ? 'selected' : ''}>${x} – ${esc(curName(x))}</option>`).join('')}</select>`;
    const eur = `<div class="cur-fixed">EUR €</div>`;
    const body = `<div class="card">
        <div class="cur-row"><input id="cur-amt" inputmode="decimal" value="${esc(c.amt)}" data-input="curAmt" aria-label="amount">${c.dir === 'from' ? eur : sel}</div>
        <button class="swap" data-act="curSwap" aria-label="swap">${ic('swap', 18)}</button>
        <div class="cur-row"><div class="cur-res" id="cur-res"></div>${c.dir === 'from' ? sel : eur}</div>
      </div>
      <p class="hint" id="cur-info"></p><button class="btn sm" data-act="curRefresh">${ic('refresh', 14)}${t('refresh')}</button>
      <h3 class="sec">${t('allCurrencies')}</h3><div id="cur-all"></div>`;
    return page(t('m_currency'), body);
  },
  mount() { curUpdate(); fetchRates(false); }
};
function curUpdate() {
  const c = S.settings.cur, rates = getRates();
  const amt = parseAmount(c.amt) / 100;
  const ok = !isNaN(amt), rate = rates[c.code];
  const res = $('#cur-res'); if (!res) return;
  if (!rate || !ok) res.textContent = '–';
  else res.textContent = c.dir === 'from' ? fmtCur(amt * rate, c.code) : fmtCur(amt / rate, 'EUR');
  $('#cur-info').textContent = (S.rates ? t('ratesFrom', fmtDate(fromIso(S.rates.date))) : t('ratesOffline')) + (rate ? ` · 1 € = ${fmtCur(rate, c.code)}` : '');
  $('#cur-all').innerHTML = !ok ? '' : CURS.filter(x => rates[x]).map(x => `<div class="row"><div class="avatar" style="--c:${avatarColor(x)};font-size:12px">${x}</div><div class="row-main"><div class="row-title">${esc(curName(x))}</div></div><div class="amt">${c.dir === 'from' ? fmtCur(amt * rates[x], x) : fmtCur(amt / rates[x], 'EUR')}</div></div>`).join('');
}
A.curAmt = el => { S.settings.cur.amt = el.value; saveSoon('settings'); curUpdate(); };

};
A.setChangePin = async () => {
  let raw = null;
  const ok = await pinPad({ title: t('currentPin'), subtitle: t('enterPinSub'), onSubmit: async pin => { const r = await checkPin(pin); if (r.err) return r.err; raw = r.raw; return true; } });

  await flushSaves();

A.setImportFile = async el => {
  const f = el.files[0]; el.value = ''; if (!f) return;

/* ============================ LOCK & SETUP ============================ */
function applyTheme() {
  document.documentElement.dataset.theme = S.settings.theme;
  document.documentElement.lang = L();
  requestAnimationFrame(() => { const m = $('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0b0d12'; });
}
async function choosePin(cancelable) {
  for (; ;) {
    let first = null;
    const a = await pinPad({ title: cancelable ? t('newPin') : t('createPin'), subtitle: t('createPinSub'), fullscreen: !cancelable, cancelable, icon: 'shield', onSubmit: async p => { first = p; return true; } });
    if (!a) return null;
    let matched = false;
    const b = await pinPad({ title: t('confirmPin'), subtitle: t('confirmPinSub'), fullscreen: !cancelable, cancelable: true, icon: 'shield', onSubmit: async p => { if (p === first) { matched = true; return true; } return t('pinMismatch'); } });
    if (b && matched) return first;
    if (cancelable && !b) return null;
  }
}
function chooseLanguage() {
  return new Promise(resolve => {
    const el = document.createElement('div'); el.className = 'pin-overlay full';
    el.innerHTML = `<div class="pin-box"><div class="pin-logo">${ic('logo', 26)}</div><div class="pin-title">PocketHub</div><div class="pin-sub">Sprache wählen · Choose language</div>
      <div class="lang-pick"><button class="btn" data-l="de"><span class="code">DE</span>Deutsch${ic('chevRight', 18)}</button><button class="btn" data-l="en"><span class="code">EN</span>English${ic('chevRight', 18)}</button></div></div>`;
    document.body.appendChild(el);
    el.addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b) return; el.remove(); resolve(b.dataset.l); });
  });
}
async function setupFlow() {
  S.settings.lang = await chooseLanguage();
  applyTheme();
  const pin = await choosePin(false);
  await setupPin(pin);
  await DB.set('settings', S.settings);
}
const unlockPad = () => pinPad({
  title: t('enterPin'), subtitle: t('enterPinSub'), fullscreen: true, cancelable: false,
  extra: `<button class="link" data-extra="forgot">${t('forgotPin')}</button>`, onExtra: forgotFlow,
  onSubmit: async pin => { const r = await checkPin(pin); return r.err || true; }
});
async function lockScreen() {
  if (LOCKED || !S.crypto) return;
  await flushSaves();
  if (CUR_VIEW && CUR_VIEW.vault) { history.replaceState(null, '', '#/'); await render(); }
  dismissAllModals();
  VS = null; LOCKED = true;
  await unlockPad();
  LOCKED = false;
  rerender();
  checkReminders();
}
async function forgotFlow() {
  const a = await openModal({ title: t('forgotPin'), cls: 'top', body: `<p style="margin:0;color:var(--muted)">${esc(t('forgotText'))}</p>`, buttons: [{ label: t('cancel'), value: false, cls: 'ghost' }, { label: t('resetApp'), value: true, cls: 'danger' }] });
  if (!a) return;
  if (!await confirmDlg(t('resetConfirm2'), t('resetApp'), true, 'top')) return;
  await DB.clear(); location.replace(location.pathname);
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (!S.crypto) return;
  if (document.hidden) {
    flushSaves(); hiddenAt = Date.now();
    if (S.settings.autolock === 0) lockScreen();
  } else {
    if (!LOCKED && hiddenAt && Date.now() - hiddenAt >= S.settings.autolock * 1000) lockScreen();
    hiddenAt = 0;
    if (!LOCKED) checkReminders();
  }
});
window.addEventListener('pagehide', () => { flushSaves(); });

/* ================================ BOOT ================================ */
async function boot() {
  try { await DB.open(); }
  catch (e) { document.body.innerHTML = '<p style="padding:20px">Storage not available (IndexedDB). Please use Chrome.</p>'; return; }
  const all = await DB.getAll();
  const def = DEFAULTS();
  S = Object.assign(def, all);
  S.settings = Object.assign(def.settings, all.settings || {});
  S.settings.cur = Object.assign({ amt: '100', code: 'USD', dir: 'from' }, S.settings.cur || {});
  S.money = Object.assign({ start: 0, entries: [] }, S.money || {});
  S.lockout = Object.assign({ fails: 0, until: 0 }, S.lockout || {});
  applyTheme();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { }
  if (!S.crypto) await setupFlow();
  else { LOCKED = true; await unlockPad(); LOCKED = false; }
  if (V[parseHash().name] && V[parseHash().name].vault) history.replaceState(null, '', '#/');
  await render();
  setInterval(tickTimer, 500);
  setInterval(checkReminders, 10000);
  checkReminders();
}
boot();
